name: Deploy to VDS

on:
  push:
    branches:
      - main  # main branch'e push olunca otomatik deploy
  workflow_dispatch:  # Manuel tetikleme de mümkün

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build project
        run: npm run build
      
      - name: 📤 Deploy to VDS via SSH
        uses: easingthemes/ssh-deploy@v4.1.10
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VDS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VDS_HOST }}
          REMOTE_USER: ${{ secrets.VDS_USER }}
          SOURCE: "dist/"
          TARGET: "/var/www/omerdogan.dev/"
          EXCLUDE: "/dist/, /node_modules/"
          SCRIPT_BEFORE: |
            echo "Deploying to omerdogan.dev..."
          SCRIPT_AFTER: |
            echo "Deployment completed!"
            sudo systemctl reload nginx
      
      - name: ✅ Deployment Success
        run: echo "🎉 Site deployed successfully to https://omerdogan.dev"

